version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.staging
    container_name: food-shop-frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    networks:
      - food-shop-network

networks:
  food-shop-network:
    driver: bridge
